---
name: Checks

"on":
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned project tools
        uses: jdx/mise-action@v3

      - name: Run aggregate local CI gate
        run: scripts/hooks/run-local-ci.sh
